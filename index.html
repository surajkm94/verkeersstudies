<title>Database Verkeersstudies Suriname</title>
<style>
:root{--bg:#f5f7f9;--card:#fff;--ink:#16222e;--mute:#5d6b78;--line:#dde3e8;--navy:#00396f;--green:#3f9f4a;--red:#d9001b;--chip:#e9eef3;--on:#00396f;--onink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--card:#17212c;--ink:#e8eef4;--mute:#9aa8b5;--line:#2a3846;--navy:#7db4ec;--chip:#223140;--on:#7db4ec;--onink:#0f1720}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:4px solid var(--navy)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:16px;padding:18px 0}
.top img{height:64px;border-radius:8px;background:#fff}
.top h1{margin:0;font-size:clamp(1.25rem,3vw,1.75rem);line-height:1.2;color:var(--navy)}
.top p{margin:4px 0 0;color:var(--mute);font-size:.92rem}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit;font-weight:600}
.lang button[aria-pressed=true]{background:var(--on);color:var(--onink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px}
.bar input[type=search]{flex:1 1 280px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
select,.btn{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.btn.pri{background:var(--on);color:var(--onink);border-color:var(--on);font-weight:600}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:2px}
details.f{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.f summary{padding:10px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between}
details.f summary span{color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 14px;max-height:220px;overflow:auto}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.chip small{color:var(--mute)}
.chip[aria-pressed=true]{background:var(--on);color:var(--onink)}.chip[aria-pressed=true] small{color:inherit}
.years{display:flex;gap:8px;align-items:center;padding:4px 14px 14px;color:var(--mute)}
.meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0}
.meta b{font-size:1.05rem}
.list{display:grid;gap:12px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:14px 16px}
.card h2{margin:0 0 2px;font-size:1.05rem;line-height:1.35}
.card .sub{color:var(--mute);font-size:.9rem;margin:0 0 6px}
.info{color:var(--mute);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--chip)}
.tag.ty{background:var(--on);color:var(--onink);font-weight:600}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.act a{text-decoration:none}
.sum{margin:8px 0 0;font-size:.9rem;color:var(--ink)}
.empty{text-align:center;padding:48px 0;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--mute);font-size:.85rem}
footer a{color:var(--navy)}
</style>
</head>

<script>
(async()=>{
let J,TG;try{[J,TG]=await Promise.all([fetch('data.json').then(r=>r.json()),fetch('tags-en.json').then(r=>r.json())])}catch(e){document.getElementById('list').textContent='Data kon niet geladen worden / Data could not be loaded.';return}
const D=J.items,UPD=J.updated;
const T={nl:{h1:"Database Verkeersstudies Suriname",sub:"Open kennisbank met verkeers- en vervoersstudies. Gratis te raadplegen en te downloaden.",q:"Zoek op titel, auteur, onderwerp of samenvatting…",new:"Nieuwste eerst",old:"Oudste eerst",az:"Titel A–Z",dl:"Download lijst (CSV)",type:"Type",tags:"Onderwerpen",pub:"Uitgever",year:"Jaar",from:"van",to:"tot",reset:"Wis filters",n:["studie","studies"],none:"Geen studies gevonden. Pas je zoekopdracht of filters aan.",open:"Bekijk document",get:"Download",by:"Door",foot:'Alle bronnen zijn aangegeven. De documenten zijn niet in het bezit van KM Smart Mobility en zijn met toestemming van de auteurs beschikbaar gesteld. Documenten toevoegen of actualiseren? Mail <a href="mailto:info@kmsmartmob.com">info@kmsmartmob.com</a>. Ontwikkeld door <a href="https://www.kmsmartmob.com">KM Smart Mobility</a>.',upd:"Laatst bijgewerkt",loc:"nl-NL"},
en:{h1:"Traffic Studies Database Suriname",sub:"Open knowledge base of traffic and transport studies. Free to browse and download. Titles and summaries are translated for convenience; the documents themselves are in their original language.",q:"Search by title, author, topic or summary…",new:"Newest first",old:"Oldest first",az:"Title A–Z",dl:"Download list (CSV)",type:"Type",tags:"Topics",pub:"Publisher",year:"Year",from:"from",to:"to",reset:"Clear filters",n:["study","studies"],none:"No studies found. Adjust your search or filters.",open:"View document",get:"Download",by:"By",foot:'All sources are credited. The documents are not owned by KM Smart Mobility and are shared with permission of the authors. Want to add or update a document? Email <a href="mailto:info@kmsmartmob.com">info@kmsmartmob.com</a>. Developed by <a href="https://www.kmsmartmob.com">KM Smart Mobility</a>.',upd:"Last updated",loc:"en-GB"}};
const tr={en:TG};
let L="nl";
const S={q:"",ty:new Set(),tg:new Set(),p:new Set(),y1:0,y2:9999,sort:"new"};
const $=id=>document.getElementById(id),yr=x=>+x.d.slice(0,4);
const lab=v=>(L==="en"&&tr.en[v])||v;
const pick=(x,k,e)=>(L==="en"&&x[e])||x[k];
const cnt=k=>{const m={};D.forEach(x=>x[k].forEach(v=>m[v]=(m[v]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))};
const years=[...new Set(D.map(yr))].sort((a,b)=>a-b);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
D.forEach(x=>x._h=norm([x.t,x.te,x.st,x.se,x.a,x.s,x.ee,...x.ty,...x.tg,...x.p,...[...x.ty,...x.tg].map(v=>tr.en[v]||"")].join(" ")));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function filtered(){const w=norm(S.q).split(/\s+/).filter(Boolean);
 return D.filter(x=>w.every(t=>x._h.includes(t))&&(!S.ty.size||x.ty.some(v=>S.ty.has(v)))&&(!S.tg.size||x.tg.some(v=>S.tg.has(v)))&&(!S.p.size||x.p.some(v=>S.p.has(v)))&&yr(x)>=S.y1&&yr(x)<=S.y2)
 .sort((a,b)=>S.sort==="old"?a.d.localeCompare(b.d):S.sort==="az"?a.t.localeCompare(b.t,"nl"):b.d.localeCompare(a.d))}
function group(k,key,open){const items=cnt(key),n=S[k].size;
 return `<details class="f"${open?" open":""} data-k="${k}"><summary>${T[L][k==="ty"?"type":k==="tg"?"tags":"pub"]}<span>${n?n+" ✓":items.length}</span></summary><div class="chips">${items.map(([v,c])=>`<button class="chip" data-k="${k}" data-v="${esc(v)}" aria-pressed="${S[k].has(v)}">${esc(lab(v))} <small>${c}</small></button>`).join("")}</div></details>`}
function buildFilters(){const op=[...document.querySelectorAll("details.f[open]")].map(d=>d.dataset.k+(d.dataset.y||""));
 const yo=op.includes("y");
 $("filters").innerHTML=group("ty","ty",op.includes("ty"))+group("tg","tg",op.includes("tg"))+group("p","p",op.includes("p"))+
 `<details class="f"${yo?" open":""} data-k="y"><summary>${T[L].year}<span>${S.y1>0||S.y2<9999?"✓":years[0]+"–"+years.at(-1)}</span></summary><div class="years">${T[L].from} <select id="y1">${years.map(y=>`<option${y===(S.y1||years[0])?" selected":""}>${y}</option>`).join("")}</select> ${T[L].to} <select id="y2">${[...years].reverse().map(y=>`<option${y===(S.y2===9999?years.at(-1):S.y2)?" selected":""}>${y}</option>`).join("")}</select></div></details>`;
 $("y1").onchange=e=>{S.y1=+e.target.value;S.y1===years[0]&&(S.y1=0);render()};
 $("y2").onchange=e=>{S.y2=+e.target.value;S.y2===years.at(-1)&&(S.y2=9999);render()}}
function render(){const t=T[L],r=filtered();
 document.documentElement.lang=L;$("h1").textContent=t.h1;$("sub").textContent=t.sub;$("q").placeholder=t.q;$("dl").textContent="⬇ "+t.dl;$("reset").textContent=t.reset;$("foot").innerHTML=t.foot;
 $("sort").innerHTML=[["new",t.new],["old",t.old],["az",t.az]].map(([v,l])=>`<option value="${v}"${S.sort===v?" selected":""}>${l}</option>`).join("");
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
 $("count").textContent=r.length+" "+t.n[r.length===1?0:1];
 const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString(t.loc,{day:"numeric",month:"long",year:"numeric"});
 if(UPD)$("foot").innerHTML+=`<br>${t.upd}: ${fmt(UPD)}`;
 $("list").innerHTML=r.length?r.map(x=>`<article class="card"><h2>${esc(pick(x,"t","te"))}</h2>${x.st?`<p class="sub">${esc(pick(x,"st","se"))}</p>`:""}
 <div class="info"><span>📅 ${fmt(x.d)}</span>${x.a?`<span>✍ ${esc(x.a)}</span>`:""}${x.p.length?`<span>🏛 ${esc(x.p.join(", "))}</span>`:""}</div>
 <div class="tags">${x.ty.map(v=>`<span class="tag ty">${esc(lab(v))}</span>`).join("")}${x.tg.map(v=>`<span class="tag">${esc(lab(v))}</span>`).join("")}</div>
 ${x.s?`<p class="sum">${esc(pick(x,"s","ee"))}</p>`:""}
 <div class="act"><a class="btn pri" href="${esc(x.u)}" target="_blank" rel="noopener">${t.open} ↗</a>${x.g?`<a class="btn" href="https://drive.google.com/uc?export=download&id=${x.g}" target="_blank" rel="noopener">⬇ ${t.get}</a>`:""}</div></article>`).join(""):`<div class="empty">${t.none}</div>`}
function refresh(){buildFilters();render()}
document.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){const s=S[c.dataset.k],v=c.dataset.v;s.has(v)?s.delete(v):s.add(v);refresh()}
 const l=e.target.closest(".lang button");if(l){L=l.dataset.l;refresh()}});
$("q").oninput=e=>{S.q=e.target.value;render()};
$("sort").onchange=e=>{S.sort=e.target.value;render()};
$("reset").onclick=()=>{S.q="";$("q").value="";S.ty.clear();S.tg.clear();S.p.clear();S.y1=0;S.y2=9999;refresh()};
$("dl").onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',r=filtered();
 const en=L==="en",h=en?["Title","Author(s)","Publication date","Type","Topics","Publisher(s)","Link"]:["Titel","Auteur(s)","Publicatiedatum","Type","Onderwerpen","Uitgever(s)","Link"];
 const csv="\ufeff"+[h,...r.map(x=>[pick(x,"t","te"),x.a,x.d,x.ty.map(lab).join(", "),x.tg.map(lab).join(", "),x.p.join(", "),x.u])].map(l=>l.map(q).join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="verkeersstudies.csv";a.click()};
refresh();
})();
</script>
</body>
